<style>
.ptabs{display:flex;gap:6px;margin:0 0 16px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.ptabs a{padding:9px 14px;text-decoration:none;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px}
.ptabs a.on{color:var(--accent-dark);border-color:var(--accent)}
.muted{color:var(--muted);font-size:13px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.pcard{display:block;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--card);text-decoration:none;color:inherit}
.pcard img,.pcard-nophoto{width:100%;height:140px;object-fit:cover;display:flex;align-items:center;justify-content:center;font-size:44px;background:var(--accent-soft)}
.pcard-body{padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpis div{border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:var(--card);font-size:12.5px;color:var(--muted)}
.kpis b{display:block;font-size:19px;color:var(--text)}
.tablewrap{overflow-x:auto}
.ptable{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--card)}
.ptable th,.ptable td{border-bottom:1px solid var(--border);padding:8px 9px;text-align:left;vertical-align:top}
.ptable th{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
.ptable input,.ptable select{width:100%;min-width:70px;padding:5px 6px;border:1px solid var(--border);border-radius:6px;font:inherit;font-size:13px}
.pbox{border:1px solid var(--border);border-radius:12px;padding:16px 18px;background:var(--card);margin-bottom:16px}
.pbox h2{font-size:16px;margin:0 0 12px}
.pdl{display:grid;grid-template-columns:200px 1fr;gap:6px 14px;font-size:14px}
.pdl dt{color:var(--muted)}
.pdl dd{margin:0;white-space:pre-wrap}
.pnote{background:#FBF1D9;border:1px solid #EBD9A8;border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:14px}
.psaved{background:var(--accent-soft);border:1px solid #C6E4C8;border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:14px}
.pcols{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}
@media(max-width:900px){.pcols{grid-template-columns:1fr}.pdl{grid-template-columns:1fr}}
</style>
