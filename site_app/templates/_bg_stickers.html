<div class="bg-stickers" aria-hidden="true">
  <!-- Только в боковых полях (вне колонки контента) — не задевают текст.
       top в px, а не vh — стикеры разложены по всей длине страницы и
       скроллятся вместе с лентой.

       Горизонталь считается не фиксированным vw/px, а долей (K) от РЕАЛЬНОЙ
       ширины бокового поля: left/right = calc(((100% - 1160px)/2) * K).
       У каждого стикера своя K (0.05–0.4) — поэтому они не выстраиваются в
       линейку у края или у текста, а рассыпаны по всей ширине поля, и с
       ростом экрана расстояния между ними тоже растут пропорционально, а не
       остаётся мёртвая пустота посередине.

       deco-near (K ~0.05–0.2, видно от 1400px) — ближе к краю.
       deco-mid  (K ~0.28–0.4, видно от 1650px) — ближе к центру/тексту;
       требует больше свободного поля, поэтому появляется позже. -->
  <img loading="lazy" decoding="async" class="deco-item deco-near" src="/assets/stickers/sticker-01.png" style="top:20px;left:calc(((100% - 1160px)/2) * 0.06);width:56px;opacity:.5;transform:rotate(-8deg)">
